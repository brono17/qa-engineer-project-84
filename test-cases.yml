---
- summary: |
    Осмотр витрины и карточек товаров
  requirement: |
    Витрина обязана отображать наименование, баллы рейтинга и две ценовые категории (зачеркнутую и действующую) для каждой позиции
  prerequisites: Пользователь находится на странице со списком продукции
  test-data: -
  steps: 
    - Спуститься вниз по ленте товаров
    - Изучить информацию в любой карточке
  expected-result: |
    Все карточки на витрине содержат полные сведения: название, рейтинг, старую и новую цену

- summary: |
    Использование строки запроса
  requirement: |
    Клиент должен обладать функцией поиска товаров по текстовому запросу
  prerequisites: Открыт главный экран магазина
  test-data: -
  steps: 
    - Активировать поле для ввода текста в левом верхнем углу
    - Напечатать нужное слово
    - Нажать кнопку Enter
  expected-result: |
    Лента товаров фильтруется, отображая позиции, соответствующие введенному тексту

- summary: |
    Поиск по случайному набору символов
  requirement: |
    Клиент должен иметь возможность искать товары по ключевому слову
  prerequisites: Открыт главный экран магазина
  test-data: -
  steps: 
    - Кликнуть по строке поиска
    - Ввести бессмысленный набор цифр и букв
    - Подтвердить поиск
  expected-result: |
    Пользователь видит уведомление об отсутствии результатов поиска

- summary: |
    Отбор продукции по марке
  requirement: |
    Клиент должен иметь возможность фильтровать товары по категориям
  prerequisites: Открыта лента товаров
  test-data: -
  steps: 
    - Отыскать блок с перечнем марок в боковой панели
    - Установить флажок напротив одного из брендов
  expected-result: |
    Список товаров обновляется, демонстрируя продукцию исключительно выбранного бренда

- summary: |
    Отбор продукции по наличию на складе
  requirement: |
    Пользователь должен иметь возможность фильтровать товары по наличию
  prerequisites: Открыта лента товаров
  test-data: -
  steps: 
    - Найти пункт "В наличии"
    - Отметить его галочкой
  expected-result: |
    Отображаются только те товары, которые помечены как доступные для покупки

- summary: |
    Перемещение товара в корзину
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину
  prerequisites: Открыт каталог товаров
  test-data: -
  steps: 
    - Выбрать любой товар
    - Нажать кнопку добавления в заказ
    - Перейти в раздел корзины
  expected-result: |
    Выбранная позиция успешно добавлена, итоговая сумма заказа корректно пересчитана

- summary: |
    Формирование и завершение покупки
  requirement: |
    Пользователь должен иметь возможность оформлять заказ
  prerequisites: В корзине находится товар, открыт экран корзины
  test-data: -
  steps: 
    - Проверить отображение товаров в корзине
    - Нажать кнопку завершения заказа
  expected-result: |
    Открывается модальное окно с подтверждением заказа, в котором присутствует рабочая кнопка закрытия

- summary: |
    Проверка отображения интерфейса в различных веб-обозревателях
  requirement: |
    Сайт должен быть протестирован на совместимость с последними версиями браузеров
  prerequisites: Открыт главный экран магазина
  test-data: -
  steps: 
    - Запустить сайт в Chrome
    - Пройтись по каталогу и добавить позицию в корзину
    - Повторить манипуляции в браузере Firefox
  expected-result: |
    Интерфейс и функциональность работают корректно во всех перечисленных браузерах
