---
- summary: |
    Осмотр витрины и карточек товаров
  requirement: |
    Витрина обязана отображать наименование, баллы рейтинга и две ценовые категории (зачеркнутую и действующую) для каждой позиции
  prerequisites: |
    - Пользователь находится на странице со списком продукции
  test-data: |
    -
  steps:
    - Прокрутить ленту товаров
    - Изучить информацию в одной из карточек
  expected-result: |
    Все карточки на витрине содержат полные сведения: название, рейтинг, старую и новую цену

- summary: |
    Поиск товара по ключевому слову
  requirement: |
    Клиент должен обладать функцией поиска товаров по текстовому запросу
  prerequisites: |
    - Открыт главный экран магазина
  test-data: |
    -
  steps:
    - Ввести название товара в строку поиска
  expected-result: |
    Лента товаров фильтруется, отображая позиции, соответствующие введенному тексту

- summary: |
    Поиск несуществующего товара
  requirement: |
    Клиент должен иметь возможность искать товары по ключевому слову
  prerequisites: |
    - Открыт главный экран магазина
  test-data: |
    -
  steps:
    - Ввести в строку поиска название товара, отсутствующего в каталоге
  expected-result: |
    Пользователь видит уведомление об отсутствии результатов поиска

- summary: |
    Фильтрация товаров по марке
  requirement: |
    Клиент должен иметь возможность фильтровать товары по категориям
  prerequisites: |
    - Открыта лента товаров
  test-data: |
    -
  steps:
    - Выбрать бренд в панели фильтрации
  expected-result: |
    Список товаров обновляется, демонстрируя продукцию исключительно выбранного бренда

- summary: |
    Фильтрация товаров по наличию
  requirement: |
    Клиент должен иметь возможность фильтровать товары по наличию
  prerequisites: |
    - Открыта лента товаров
  test-data: |
    -
  steps:
    - Отметить галочку "В наличии"
  expected-result: |
    Отображаются только те товары, которые помечены как доступные для покупки

- summary: |
    Фильтрация товаров по категории
  requirement: |
    Клиент должен иметь возможность фильтровать товары по категориям
  prerequisites: |
    - Открыта лента товаров
  test-data: |
    -
  steps:
    - Выбрать категорию в панели фильтрации
  expected-result: |
    Список товаров обновляется, демонстрируя продукцию только выбранной категории

- summary: |
    Фильтрация товаров по цене
  requirement: |
    Пользователь должен иметь возможность фильтровать товары по цене
  prerequisites: |
    - Открыта лента товаров
  test-data: |
    -
  steps:
    - Ввести минимальную и максимальную цену в поля фильтра
  expected-result: |
    Отображаются только товары, цена которых входит в заданный диапазон

- summary: |
    Осмотр страницы товара
  requirement: |
    Пользователь должен иметь возможность просматривать подробную информацию о товаре на отдельной странице
  prerequisites: |
    - Открыта лента товаров
  test-data: |
    -
  steps:
    - Нажать на название любого товара
  expected-result: |
    Открывается отдельная страница с полным описанием товара, его рейтингом и ценой

- summary: |
    Переход в категорию по хэштегу
  requirement: |
    Пользователь должен иметь возможность переходить в категорию по хэштегу
  prerequisites: |
    - Открыта страница товара
  test-data: |
    -
  steps:
    - Нажать на хэштег, расположенный на странице товара
  expected-result: |
    Пользователь переходит в категорию, к которой относится выбранный товар

- summary: |
    Добавление одного и того же товара в корзину
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину
  prerequisites: |
    - Открыта лента товаров
  test-data: |
    -
  steps:
    - Нажать кнопку "В корзину" на карточке товара
    - Повторить действие на том же товаре несколько раз
  expected-result: |
    Количество выбранного товара в корзине увеличивается, итоговая сумма пересчитывается

- summary: |
    Добавление разных товаров в корзину
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину
  prerequisites: |
    - Открыта лента товаров
  test-data: |
    -
  steps:
    - Нажать кнопку "В корзину" на карточке первого товара
    - Нажать кнопку "В корзину" на карточке второго товара
  expected-result: |
    В корзине отображаются два разных товара, итоговая сумма складывается из их цен

- summary: |
    Удаление товара из корзины
  requirement: |
    Пользователь должен иметь возможность удалять товары из корзины
  prerequisites: |
    - В корзине находится хотя бы один товар
    - Открыт экран корзины
  test-data: |
    -
  steps:
    - Нажать кнопку "Удалить" напротив одного из товаров
  expected-result: |
    Выбранный товар удаляется, оставшиеся товары и итоговая сумма пересчитываются

- summary: |
    Полная очистка корзины
  requirement: |
    Пользователь должен иметь возможность очищать корзину
  prerequisites: |
    - В корзине находится хотя бы один товар
    - Открыт экран корзины
  test-data: |
    -
  steps:
    - Нажать кнопку "Очистить корзину"
  expected-result: |
    Все товары удаляются из корзины, корзина становится пустой, сумма равна нулю

- summary: |
    Навигация по страницам каталога
  requirement: |
    Пользователь должен иметь возможность просматривать товары с постраничным выводом (пагинация)
  prerequisites: |
    - Открыта лента товаров
  test-data: |
    -
  steps:
    - Нажать кнопку "Следующая"
  expected-result: |
    Пользователь переходит на следующую страницу каталога

- summary: |
    Оформление заказа с переходом на страницу оплаты
  requirement: |
    Пользователь должен иметь возможность оформлять заказ
  prerequisites: |
    - В корзине находится товар
    - Открыт экран корзины
  test-data: |
    -
  steps:
    - Нажать кнопку "Оформить заказ"
  expected-result: |
    Пользователь переходит на страницу оплаты, где может завершить покупку

- summary: |
    Проверка локализации
  requirement: |
    Интерфейс должен предоставлять возможность переключения языка между русским и английским
  prerequisites: |
    - Открыт главный экран магазина
  test-data: |
    -
  steps:
    - Нажать на переключатель языка в верхнем меню
  expected-result: |
    Все элементы интерфейса меняются на выбранный язык

- summary: |
    Проверка мобильной версии
  requirement: |
    Сайт должен быть адаптивным и удобным для использования на мобильных устройствах
  prerequisites: |
    - Открыт главный экран магазина
  test-data: |
    -
  steps:
    - Открыть сайт в мобильном разрешении экрана
    - Добавить товар в корзину
  expected-result: |
    Интерфейс корректно отображается на маленьком экране, все кнопки кликабельны

- summary: |
    Проверка работы сети (DevTools)
  requirement: |
    Сайт должен корректно обрабатывать запросы и получать ответы от сервера
  prerequisites: |
    - Открыт главный экран магазина
  test-data: |
    -
  steps:
    - Открыть вкладку Network в DevTools
    - Добавить товар в корзину
    - Изучить сетевые запросы
  expected-result: |
    Все запросы и ответы сервера приходят со статусом 200 (OK) без ошибок

- summary: |
    Проверка отображения интерфейса в различных веб-обозревателях
  requirement: |
    Сайт должен быть протестирован на совместимость с последними версиями браузеров
  prerequisites: |
    - Открыт главный экран магазина
  test-data: |
    -
  steps:
    - Добавить товар в корзину в браузере Chrome
    - Добавить товар в корзину в браузере Firefox
  expected-result: |
    Интерфейс и функциональность работают корректно во всех перечисленных браузерах
