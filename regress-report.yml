bugreports:
  - summary: |
      На карточках товаров отсутствует рейтинг
    environment: |
      Google Chrome, ОС Windows 11
    steps-to-reproduce: |
      1. Зайти на главную страницу магазина.
      2. Изучить карточку товара.
    expected-result: |
      Карточка товара содержит рейтинг.
    actual-result: |
      Рейтинг на карточке товара отсутствует.

  - summary: |
      Не происходит переход на страницу оплаты после оформления заказа
    environment: |
      Google Chrome, ОС Windows 11
    steps-to-reproduce: |
      1. Добавить товар в корзину.
      2. Перейти в корзину.
      3. Нажать кнопку "Оформить заказ".
    expected-result: |
      Пользователь переходит на страницу оплаты.
    actual-result: |
      Вместо страницы оплаты пользователь видит только всплывающее окно.

  - summary: |
      Запрос при оформлении заказа возвращает ошибку 500 (Internal Server Error)
    environment: |
      Google Chrome, ОС Windows 11
    steps-to-reproduce: |
      1. Открыть главный экран магазина.
      2. Открыть вкладку Network в DevTools.
      3. Добавить товар в корзину.
      4. Перейти в корзину.
      5. Нажать кнопку "Оформить заказ".
    expected-result: |
      Все запросы и ответы сервера приходят со статусом 200 (OK) без ошибок.
    actual-result: |
      Запрос POST /api/orders возвращает ошибку 500 Internal Server Error.

  - summary: |
      При переключении на английский язык названия товаров не переводятся
    environment: |
      Google Chrome, ОС Windows 11
    steps-to-reproduce: |
      1. Открыть главный экран магазина.
      2. Нажать на переключатель языка в верхнем меню.
      3. Выбрать английский язык (EN).
      4. Перейти в каталог.
    expected-result: |
      Все элементы интерфейса, включая названия товаров, отображаются на английском языке.
    actual-result: |
      Названия товаров и часть интерфейса остаются на русском языке.
