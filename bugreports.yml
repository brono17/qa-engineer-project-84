---
- summary: |
    На карточках товаров отсутствует рейтинг
  environment: |
    Google Chrome 107.0.5304.121 (Официальная сборка) (64 бит)
    ОС Windows 11
  steps-to-reproduce: |
    1. Зайти на главную страницу магазина.
    2. Прокрутить ленту товаров.
    3. Изучить информацию в любой карточке.
  expected-result: |
    На карточке товара должен отображаться рейтинг, указанный в функциональных требованиях.
  actual-result: |
    На карточках товаров отсутствует рейтинг. Видны только название, цена и кнопка "В корзину". Скриншот ошибки: bug.png

- summary: |
    Не происходит переход на страницу оплаты после оформления заказа
  environment: |
    Google Chrome 107.0.5304.121 (Официальная сборка) (64 бит)
    ОС Windows 11
  steps-to-reproduce: |
    1. Добавить товар в корзину.
    2. Перейти в корзину.
    3. Нажать кнопку "Оформить заказ".
  expected-result: |
    После нажатия кнопки пользователь должен перейти на отдельную страницу оплаты.
  actual-result: |
    После нажатия кнопки пользователь видит только всплывающее модальное окно "Заказ успешно оформлен". Отдельная страница оплаты отсутствует. Скриншот ошибки: bug.png

- summary: |
    Поиск и фильтры не работают за пределами текущей страницы каталога
  environment: |
    Google Chrome 107.0.5304.121 (Официальная сборка) (64 бит)
    ОС Windows 11
  steps-to-reproduce: |
    1. Открыть каталог товаров.
    2. Перейти на страницу 2 (кнопка "Следующая").
    3. Ввести в поле поиска название товара, который находится на странице 1.
    4. Аналогично проверить работу фильтров (по бренду, наличию, категории, цене).
  expected-result: |
    Поиск и фильтры должны работать по всему каталогу, так как это основное функциональное требование.
  actual-result: |
    Поиск и фильтры работают только на текущей странице. Товары, находящиеся на других страницах, не отображаются.

- summary: |
    Кликабельная область карточки товара не совпадает с видимой рамкой
  environment: |
    Google Chrome 107.0.5304.121 (Официальная сборка) (64 бит)
    ОС Windows 11
  steps-to-reproduce: |
    1. Открыть каталог товаров.
    2. Открыть вкладку DevTools (F12).
    3. Навести курсор на карточку товара.
    4. Изучить рамку (border) и кликабельную область.
  expected-result: |
    Кликабельная область карточки товара укладывается в границы видимой рамки, и нажатие на любую часть карточки (название, текст, кнопка) приводит к открытию страницы товара.
  actual-result: |
    Нажатие на карточку товара только на определенные части (например, на название) приводит к открытию страницы. Нажатие на пустое пространство внутри рамки не работает.

- summary: |
    Хэштег на странице товара ведет в пустую или некорректную категорию
  environment: |
    Google Chrome 107.0.5304.121 (Официальная сборка) (64 бит)
    ОС Windows 11
  steps-to-reproduce: |
    1. Открыть страницу товара.
    2. Нажать на хэштег, расположенный на странице товара.
    3. Изучить категорию, в которую перешел пользователь.
  expected-result: |
    Пользователь переходит в категорию, к которой относится выбранный товар.
  actual-result: |
    Хэштег ведет в некорректную категорию (или к пустому списку товаров), и пользователь выходит на 1-ю страницу каталога без фильтрации.

- summary: |
    Значения в столбце "Количество" не выровнены при добавлении разных товаров
  environment: |
    Google Chrome 107.0.5304.121 (Официальная сборка) (64 бит)
    ОС Windows 11
  steps-to-reproduce: |
    1. Открыть каталог товаров.
    2. Нажать кнопку "В корзину" на карточке первого товара.
    3. Нажать кнопку "В корзину" на карточке второго товара.
    4. Перейти в корзину.
  expected-result: |
    Значения в столбце "Количество" выровнены по центру или по правому краю, как в остальных столбцах корзины.
  actual-result: |
    Значения в столбце "Количество" отображаются не выровнено относительно других столбцов, что затрудняет чтение таблицы корзины.

- summary: |
    При переключении на английский язык названия товаров не переводятся
  environment: |
    Google Chrome 107.0.5304.121 (Официальная сборка) (64 бит)
    ОС Windows 11
  steps-to-reproduce: |
    1. Открыть главный экран магазина.
    2. Нажать на переключатель языка в верхнем меню.
    3. Выбрать английский язык (EN).
    4. Перейти в каталог.
  expected-result: |
    Все элементы интерфейса, включая названия товаров, отображаются на английском языке.
  actual-result: |
    При переключении на английский язык названия товаров, а также часть элементов интерфейса (меню, кнопки) остаются на русском языке. Перевод не применяется. Скриншот ошибки: bug.png

- summary: |
    Запрос при оформлении заказа возвращает ошибку 500 (Internal Server Error)
  environment: |
    Google Chrome 107.0.5304.121 (Официальная сборка) (64 бит)
    ОС Windows 11
  steps-to-reproduce: |
    1. Открыть главный экран магазина.
    2. Открыть вкладку Network в DevTools.
    3. Добавить товар в корзину.
    4. Перейти в корзину.
    5. Нажать кнопку "Оформить заказ".
    6. Изучить сетевые запросы.
  expected-result: |
    Все запросы и ответы сервера приходят со статусом 200 (OK) без ошибок.
  actual-result: |
    При оформлении заказа запрос POST /api/orders возвращает ошибку 500 Internal Server Error. Скриншот ошибки: bug.png

- summary: |
    Кнопка в модальном окне подтверждения заказа обрезана и имеет некорректную надпись
  environment: |
    Google Chrome 107.0.5304.121 (Официальная сборка) (64 бит)
    ОС Windows 11
  steps-to-reproduce: |
    1. Добавить любой продукт в корзину.
    2. Перейти в раздел корзины.
    3. Нажать кнопку "Оформить заказ".
    4. Дождаться появления окна подтверждения.
    5. Посмотреть на кнопки внизу появившегося окна.
  expected-result: |
    Окно закрывается стандартной кнопкой (крестик или "ОК"), которая корректно выполняет свою функцию.
  actual-result: |
    Вместо привычной кнопки в правом нижнем углу отображается элемент с обрезанной надписью (виден только фрагмент "мер") и кнопка "Назад". Эти кнопки не дают корректно завершить действие. Скриншот ошибки: bug.png
