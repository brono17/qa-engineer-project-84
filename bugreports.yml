---
- summary: |
    Отсутствует рейтинг товара на карточках каталога
  environment: |
    Google Chrome 107.0.5304.121 (Официальная сборка) (64 бит)
    ОС Windows 11
  steps-to-reproduce: |
    1. Зайти на главную страницу магазина.
    2. Прокрутить ленту товаров.
    3. Изучить информацию в любой карточке.
  expected-result: |
    На карточке товара должен отображаться рейтинг, указанный в функциональных требованиях.
  actual-result: |
    На карточках товаров отсутствует рейтинг. Видны только название, цена и кнопка "В корзину".
  attachments: |
    Скриншот ошибки: bug.png

- summary: |
    Отсутствует переход на страницу оплаты после оформления заказа
  environment: |
    Google Chrome 107.0.5304.121 (Официальная сборка) (64 бит)
    ОС Windows 11
  steps-to-reproduce: |
    1. Добавить товар в корзину.
    2. Перейти в корзину.
    3. Нажать кнопку "Оформить заказ".
  expected-result: |
    После нажатия кнопки пользователь должен перейти на отдельную страницу оплаты.
  actual-result: |
    После нажатия кнопки пользователь видит только всплывающее модальное окно "Заказ успешно оформлен". Отдельная страница оплаты отсутствует, что противоречит функциональным требованиям.
  attachments: |
    Скриншот ошибки: bug.png

- summary: |
    Поиск и фильтрация не работают по всему каталогу
  environment: |
    Google Chrome 107.0.5304.121 (Официальная сборка) (64 бит)
    ОС Windows 11
  steps-to-reproduce: |
    1. Открыть каталог товаров.
    2. Перейти на страницу 2 (кнопка "Следующая").
    3. Ввести в поле поиска название товара, который находится на странице 1.
    4. Аналогично проверить работу фильтров (по бренду, наличию, категории, цене).
  expected-result: |
    Поиск и фильтры должны работать по всему каталогу, так как это основное функциональное требование.
  actual-result: |
    Поиск и фильтры работают только на текущей странице. Товары, находящиеся на других страницах, не отображаются.
  attachments: |
    Скриншот ошибки: bug.png

- summary: |
    Некорректная кликабельная область карточки товара
  environment: |
    Google Chrome 107.0.5304.121 (Официальная сборка) (64 бит)
    ОС Windows 11
  steps-to-reproduce: |
    1. Открыть каталог товаров.
    2. Открыть вкладку DevTools (F12).
    3. Навести курсор на карточку товара.
    4. Изучить рамку (border) и кликабельную область.
  expected-result: |
    Кликабельная область карточки товара укладывается в границы видимой рамки, и нажатие на любую часть карточки (название, текст, кнопка) приводит к открытию страницы товара.
  actual-result: |
    Нажатие на карточку товара только на определенные части (например, на название) приводит к открытию страницы. Нажатие на пустое пространство внутри рамки не работает.
  attachments: |
    Скриншот ошибки: bug.png

- summary: |
    Хэштег на странице товара ведет в некорректную категорию
  environment: |
    Google Chrome 107.0.5304.121 (Официальная сборка) (64 бит)
    ОС Windows 11
  steps-to-reproduce: |
    1. Открыть страницу товара.
    2. Нажать на хэштег, расположенный на странице товара.
    3. Изучить категорию, в которую перешел пользователь.
  expected-result: |
    Пользователь переходит в категорию, к которой относится выбранный товар.
  actual-result: |
    Хэштег ведет в некорректную категорию (или к пустому списку товаров), и пользователь выходит на 1-ю страницу каталога без фильтрации.
  attachments: |
    Скриншот ошибки: bug.png

- summary: |
    Некорректная работа корзины при добавлении разных товаров
  environment: |
    Google Chrome 107.0.5304.121 (Официальная сборка) (64 бит)
    ОС Windows 11
  steps-to-reproduce: |
    1. Открыть каталог товаров.
    2. Нажать кнопку "В корзину" на карточке первого товара.
    3. Нажать кнопку "В корзину" на карточке второго товара.
    4. Перейти в корзину.
  expected-result: |
    Корзина должна содержать двух разных товаров, а итоговая сумма должна соответствовать сумме их цен.
  actual-result: |
    В корзине неверно подсчитывается итоговая сумма (или товары отображаются в количестве, которое не соответствует добавленному), или правильно добавляется только один товар.
  attachments: |
    Скриншот ошибки: bug.png

- summary: |
    Некорректная локализация интерфейса при переключении языка
  environment: |
    Google Chrome 107.0.5304.121 (Официальная сборка) (64 бит)
    ОС Windows 11
  steps-to-reproduce: |
    1. Открыть главный экран магазина.
    2. Нажать на переключатель языка в верхнем меню.
    3. Выбрать английский язык (EN).
    4. Перейти в каталог.
    5. Выбрать испанский язык (ES) и перейти в каталог.
  expected-result: |
    Все элементы интерфейса (меню, названия товаров, кнопки, корзина) отображаются на выбранном языке.
  actual-result: |
    Часть элементов интерфейса (например, кнопки, корзина, или атрибуты товаров) остались на русском языке или не переведены, при переключении на английский или испанский язык.
  attachments: |
    Скриншот ошибки: bug.png

- summary: |
    Некорректная работа кнопки в модальном окне подтверждения заказа
  environment: |
    Google Chrome 107.0.5304.121 (Официальная сборка) (64 бит)
    ОС Windows 11
  steps-to-reproduce: |
    1. Добавить любой продукт в корзину.
    2. Перейти в раздел корзины.
    3. Нажать кнопку "Оформить заказ".
    4. Дождаться появления окна подтверждения.
    5. Посмотреть на кнопки внизу появившегося окна.
  expected-result: |
    Окно закрывается стандартной кнопкой (крестик или "ОК"), которая корректно выполняет свою функцию.
  actual-result: |
    Вместо привычной кнопки в правом нижнем углу отображается элемент с обрезанной надписью (виден только фрагмент "мер") и кнопка "Назад". Эти кнопки не дают корректно завершить действие.
  attachments: |
    Скриншот ошибки: bug.png
