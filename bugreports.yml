---
- summary: |
    Некорректная работа кнопки в модальном окне подтверждения заказа
  environment: |
    Google Chrome 107.0.5304.121 (Официальная сборка) (64 бит)
    ОС Windows 10
  steps-to-reproduce: |
    1. Добавить любой продукт в корзину.
    2. Перейти в раздел корзины.
    3. Нажать кнопку "Оформить заказ".
    4. Дождаться появления окна подтверждения.
    5. Посмотреть на кнопки внизу появившегося окна.
  expected-result: |
    Окно закрывается стандартной кнопкой (крестик или "ОК"), которая корректно выполняет свою функцию.
  actual-result: |
    Вместо привычной кнопки в правом нижнем углу отображается элемент с обрезанной надписью (виден только фрагмент "мер") и кнопка "Назад". Эти кнопки не дают корректно завершить действие.
  attachments: |
    Скриншот ошибки загружен в корень репозитория
