---
functional:
  - Пользователь должен иметь возможность просматривать каталог товаров
  - Пользователь должен иметь возможность просматривать подробную информацию о товаре на отдельной странице
  - Пользователь должен иметь возможность фильтровать товары
  - Пользователь должен иметь возможность искать товары по ключевому слову
  - Пользователь должен иметь возможность фильтровать товары по категориям
  - Пользователь должен иметь возможность просматривать товары с постраничным выводом (пагинация)
  - В каталоге должно отображаться название товара
  - В каталоге должен отображаться рейтинг товара
  - В каталоге должна отображаться цена товара со скидкой
  - В каталоге должна отображаться цена товара без скидки
  - На странице товара должно отображаться название товара
  - На странице товара должен отображаться рейтинг товара
  - На странице товара должна отображаться цена товара со скидкой
  - На странице товара должна отображаться цена товара без скидки
  - Пользователь должен иметь возможность добавлять товары в корзину
  - После добавления товара в корзину пользователь должен иметь возможность продолжить выбор товаров в каталоге
  - Пользователь должен иметь возможность просматривать содержимое корзины
  - Пользователь должен иметь возможность удалять товары из корзины
  - На странице корзины пользователь должен иметь возможность перейти обратно в каталог для продолжения выбора товаров
  - Пользователь должен иметь возможность оформлять заказ
  - При оформлении заказа должен происходить переход на страницу оплаты
  - Приложение должно работать как SPA (без перезагрузки страниц при навигации)
  - Данные корзины должны сохраняться между сессиями пользователя в браузере
  - Интерфейс должен предоставлять возможность переключения языка между русским и английским

non-functional:
  - Сайт должен быть адаптивным и удобным для использования на мобильных устройствах
  - Сайт должен иметь мобильную версию интерфейса
  - Сайт должен быть доступен на различных устройствах (десктопы, планшеты, смартфоны)
  - Сайт должен быть оптимизирован для высокой скорости работы и быстрой загрузки страниц
  - Сайт должен быть безопасным и защищать данные пользователя
  - Сайт должен быть протестирован на совместимость с последними версиями браузеров
  - Сайт должен быть способен обрабатывать большое количество трафика (масштабируемость)
  - Сайт должен быть доступен для пользователей без использования VPN (прямой доступ из сети Интернет)

implicit:
  - Сайт должен иметь интуитивно понятную навигацию, позволяющую пользователю легко перемещаться между каталогом, страницей товара и корзиной
  - При добавлении товара в корзину пользователь должен получать визуальное подтверждение (уведомление или анимация)
  - Сайт должен корректно обрабатывать состояния загрузки данных (лоадеры, скелетоны) для улучшения пользовательского опыта
  - При отсутствии товаров в корзине или каталоге должно отображаться информативное сообщение для пользователя
  - Цены должны отображаться с учетом выбранной локали (валюты и формата чисел)
  - При переключении языка интерфейса все текстовые элементы, включая сообщения об ошибках и подсказки, должны переводиться на выбранный язык
  - Сайт должен иметь единый стиль оформления (дизайн-систему) для всех страниц
  - Данные о товарах должны загружаться асинхронно для улучшения производительности
